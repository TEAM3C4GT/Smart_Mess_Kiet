# Render Blueprint for Smart Mess & KFC Management System
# To deploy: Go to Render Dashboard -> New -> Blueprint -> Connect your repo.
#
# Free Tier Notice:
# - Backend (Express + Socket.IO) uses `plan: free`
# - Frontend (Vite/React) uses `runtime: static` (Free)
# - Database: Use a free MongoDB Atlas M0 cluster (mongodb+srv://...)

services:
  # 1) Express REST API + Socket.IO Realtime Gateway
  - type: web
    name: smart-mess-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI          # Your MongoDB Atlas URI (mongodb+srv://<user>:<pass>@cluster0.../smart-mess-kfc)
        sync: false
      - key: JWT_SECRET           # Render automatically generates a cryptographically secure key
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DNS_SERVERS          # Ensures reliable Atlas mongodb+srv:// SRV resolution
        value: 8.8.8.8,1.1.1.1
      - key: ALLOWED_ORIGINS      # Your frontend URL (e.g. https://smart-mess-frontend.onrender.com)
        sync: false
      - key: AI_SERVICE_URL       # Optional: URL of FastAPI AI service if deployed, or leave blank
        sync: false

  # 2) Vite / React Single Page Application (Static Site)
  - type: web
    name: smart-mess-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL         # Your backend URL (e.g. https://smart-mess-backend.onrender.com)
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3) Optional: FastAPI Mess Guide AI Microservice (Docker)
  # Uncomment this service if you wish to run the RAG + LLM chat service on Render.
  # Note: Requires a paid plan (standard with >= 2GB RAM) for PyTorch + GGUF execution.
